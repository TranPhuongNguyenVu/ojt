<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Xác nhận vé xem phim</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f2f2;font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f2f2;padding:24px 0;">
        <tr>
            <td align="center">
                <table width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">

                    <tr th:replace="~{mail/fragments/email-shell :: header(chipLabel='VÉ XEM PHIM')}"></tr>

                    <tr>
                        <td style="padding:20px 24px 0 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;color:#374151;">
                                <tr>
                                    <td style="padding:5px 0;color:#6b7280;width:140px;">PHIM</td>
                                    <td style="padding:5px 0;font-weight:bold;" th:text="${movieName}">Tên phim</td>
                                </tr>
                                <tr>
                                    <td style="padding:5px 0;color:#6b7280;">SUẤT CHIẾU</td>
                                    <td style="padding:5px 0;" th:text="${showtimeText}">Giờ chiếu</td>
                                </tr>
                                <tr>
                                    <td style="padding:5px 0;color:#6b7280;">PHÒNG CHIẾU</td>
                                    <td style="padding:5px 0;" th:text="${roomName}">Phòng</td>
                                </tr>
                                <tr>
                                    <td style="padding:5px 0;color:#6b7280;">SỐ GHẾ</td>
                                    <td style="padding:5px 0;" th:text="${ticketCount}">1</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:20px 24px 0 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0" style="font-size:13px;border-collapse:collapse;">
                                <tr th:style="'background-color:' + ${colorPrimary} + ';'">
                                    <th align="center" style="padding:8px 4px;color:#ffffff;font-size:12px;width:32px;">STT</th>
                                    <th align="left" style="padding:8px 4px;color:#ffffff;font-size:12px;">MẶT HÀNG</th>
                                    <th align="center" style="padding:8px 4px;color:#ffffff;font-size:12px;width:60px;">SL</th>
                                    <th align="right" style="padding:8px 4px;color:#ffffff;font-size:12px;width:90px;">ĐƠN GIÁ</th>
                                    <th align="right" style="padding:8px 4px;color:#ffffff;font-size:12px;width:100px;">THÀNH TIỀN</th>
                                </tr>
                                <tr th:each="seat, iter : ${seats}" style="border-bottom:1px solid #f0f0f0;">
                                    <td align="center" style="padding:7px 4px;color:#374151;" th:text="${iter.count}">1</td>
                                    <td align="left" style="padding:7px 4px;color:#374151;" th:text="'Ghế ' + ${seat.seatLabel} + ' (' + ${seat.seatType == 2 ? 'Đôi' : (seat.seatType == 1 ? 'VIP' : 'Thường')} + ')'">Ghế A1 (Thường)</td>
                                    <td align="center" style="padding:7px 4px;color:#374151;">1</td>
                                    <td align="right" style="padding:7px 4px;color:#374151;" th:text="${#numbers.formatDecimal(seat.price, 1, 'POINT', 0, 'POINT')}">80.000</td>
                                    <td align="right" style="padding:7px 4px;color:#374151;" th:text="${#numbers.formatDecimal(seat.price, 1, 'POINT', 0, 'POINT')}">80.000</td>
                                </tr>
                                <tr th:each="line, iter : ${concessions}" style="border-bottom:1px solid #f0f0f0;">
                                    <td align="center" style="padding:7px 4px;color:#374151;" th:text="${ticketCount + iter.count}">1</td>
                                    <td align="left" style="padding:7px 4px;color:#374151;" th:text="${line.itemName}">Bắp rang bơ</td>
                                    <td align="center" style="padding:7px 4px;color:#374151;" th:text="${line.quantity}">1</td>
                                    <td align="right" style="padding:7px 4px;color:#374151;" th:text="${#numbers.formatDecimal(line.unitPrice, 1, 'POINT', 0, 'POINT')}">50.000</td>
                                    <td align="right" style="padding:7px 4px;color:#374151;" th:text="${#numbers.formatDecimal(line.lineTotal, 1, 'POINT', 0, 'POINT')}">50.000</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:10px 24px 0 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="padding:0;color:#6b7280;font-size:13px;">Tạm tính</td>
                                    <td align="right" style="padding:0;color:#374151;font-size:13px;" th:text="${#numbers.formatDecimal(subtotalMoney, 1, 'POINT', 0, 'POINT')}">180.000</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr th:if="${discountAmount != null and discountAmount > 0}">
                        <td style="padding:4px 24px 0 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="padding:0;color:#dc2626;font-size:13px;font-style:italic;">Giảm giá</td>
                                    <td align="right" style="padding:0;color:#dc2626;font-size:13px;font-style:italic;font-weight:bold;" th:text="'-' + ${#numbers.formatDecimal(discountAmount, 1, 'POINT', 0, 'POINT')}">-50.000</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:16px 24px 0 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0" th:style="'background-color:' + ${colorPrimary} + ';border-radius:6px;'">
                                <tr>
                                    <td style="padding:12px 16px;color:#ffffff;font-size:14px;font-weight:bold;">TỔNG TIỀN (VNĐ)</td>
                                    <td align="right" style="padding:12px 16px;color:#ffffff;font-size:18px;font-weight:bold;" th:text="${#numbers.formatDecimal(totalMoney, 1, 'POINT', 0, 'POINT')}">130.000</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr th:replace="~{mail/fragments/email-shell :: qrBlock(cid=${qrCid}, altText='QR check-in', caption='Xuất trình mã QR này tại quầy soát vé')}"></tr>

                    <tr>
                        <td style="padding:0 24px 8px 24px;text-align:center;">
                            <span style="color:#9ca3af;font-size:10px;letter-spacing:0.5px;">MÃ VÉ: </span>
                            <span style="color:#111827;font-size:13px;font-weight:bold;letter-spacing:1px;" th:text="${ticketCode}">TICKET-CODE</span>
                        </td>
                    </tr>

                    <tr th:replace="~{mail/fragments/email-shell :: footer(line1='Vui lòng xuất trình mã QR này tại quầy soát vé', line2='Cảm ơn bạn đã đặt vé. Chúc bạn xem phim vui vẻ!')}"></tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
