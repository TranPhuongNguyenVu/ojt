<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Thông báo tài khoản</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f2f2;font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f2f2;padding:24px 0;">
        <tr>
            <td align="center">
                <table width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">

                    <tr th:replace="~{mail/fragments/email-shell :: header(chipLabel=${chipLabel})}"></tr>
                    <tr th:replace="~{mail/fragments/email-shell :: title(text=${title})}"></tr>

                    <tr>
                        <td style="padding:16px 24px 0 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;color:#374151;">
                                <tr>
                                    <td style="padding:0;line-height:1.6;">
                                        Chào <span style="font-weight:bold;" th:text="${fullName}">Khách hàng</span>,
                                    </td>
                                </tr>
                                <tr th:each="line : ${introLines}">
                                    <td style="padding:8px 0 0 0;line-height:1.6;" th:text="${line}">Nội dung email</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr th:if="${fields != null and !fields.isEmpty()}">
                        <td style="padding:16px 24px 0 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;color:#374151;background-color:#f9fafb;border-radius:6px;">
                                <tr th:each="field : ${fields}">
                                    <td style="padding:10px 14px;color:#6b7280;width:160px;" th:text="${field.label()}">Nhãn</td>
                                    <td style="padding:10px 14px;font-weight:bold;" th:text="${field.value()}">Giá trị</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr th:if="${highlightValue != null}">
                        <td style="padding:16px 24px 0 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0" th:style="'background-color:' + ${colorPrimary} + ';border-radius:6px;'">
                                <tr>
                                    <td align="center" style="padding:16px;">
                                        <div style="color:#ffffff;font-size:12px;letter-spacing:1px;" th:text="${highlightLabel}">NHÃN</div>
                                        <div style="color:#ffffff;font-size:26px;font-weight:bold;letter-spacing:3px;margin-top:6px;" th:text="${highlightValue}">GIÁ TRỊ</div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr th:if="${noteText != null}">
                        <td style="padding:12px 24px 0 24px;">
                            <p style="margin:0;color:#9ca3af;font-size:12px;text-align:center;font-style:italic;" th:text="${noteText}">Ghi chú</p>
                        </td>
                    </tr>

                    <tr>
                        <td style="height:20px;"></td>
                    </tr>

                    <tr th:replace="~{mail/fragments/email-shell :: footer(line1=${footerLine1}, line2=${footerLine2})}"></tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
