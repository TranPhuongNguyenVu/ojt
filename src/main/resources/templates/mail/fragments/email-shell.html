<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <table>
        <tr th:fragment="header(chipLabel)">
            <td style="padding:20px 24px;border-bottom:1px solid #eeeeee;">
                <table width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                        <td valign="middle">
                            <div style="color:#111827;font-size:20px;font-weight:bold;letter-spacing:0.5px;">CINEMA ELITE</div>
                        </td>
                        <td align="right" valign="middle">
                            <span th:style="'display:inline-block;background-color:' + ${colorPrimary} + ';color:#ffffff;font-size:11px;font-weight:bold;letter-spacing:0.5px;padding:6px 12px;border-radius:999px;'" th:text="${chipLabel}">CHIP</span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr th:fragment="title(text)">
            <td style="padding:24px 24px 0 24px;text-align:center;">
                <h1 th:style="'margin:0;color:' + ${colorPrimary} + ';font-size:19px;letter-spacing:0.5px;'" th:text="${text}">TITLE</h1>
            </td>
        </tr>

        <tr th:fragment="qrBlock(cid, altText, caption)">
            <td style="padding:24px;text-align:center;">
                <table cellpadding="0" cellspacing="0" style="margin:0 auto;">
                    <tr>
                        <td align="center" style="border:1px solid #e5e7eb;border-radius:12px;padding:12px;">
                            <img th:src="'cid:' + ${cid}" th:alt="${altText}" width="240" height="240" style="display:block;" />
                        </td>
                    </tr>
                </table>
                <p style="margin:10px 0 0 0;color:#6b7280;font-size:12px;" th:text="${caption}">Caption</p>
            </td>
        </tr>

        <tr th:fragment="footer(line1, line2)">
            <td style="padding:0 24px 20px 24px;">
                <p style="margin:0;color:#6b7280;font-size:12px;text-align:center;" th:text="${line1}">Line1</p>
                <p style="margin:8px 0 0 0;color:#9ca3af;font-size:12px;text-align:center;" th:text="${line2}">Line2</p>
            </td>
        </tr>
    </table>
</body>
</html>
